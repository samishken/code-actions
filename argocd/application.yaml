apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myap-argo-application
  namespace: argocd
spec:
    project: default
    source:
        repoURL: https://github.com/samishken/code-actions.git
        targetRevision: HEAD
        path: helm/appcharts/templates
    destination:
        server: https://kubernetes.default.svc
        namespace: default

    syncPolicy:
        syncOptions:
            - CreateNamespace=true

        automated:
            prune: true
            selfHeal: true
        
        

    